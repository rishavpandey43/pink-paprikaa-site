packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

# pnpm 10 blocks dependency build scripts by default. Only packages that
# genuinely need to compile native bindings at install time belong here.
onlyBuiltDependencies:
  - nx
  - "@swc/core"
  - "@parcel/watcher"
  - esbuild
  - less
  - sharp
  - unrs-resolver

peerDependencyRules:
  allowedVersions:
    "eslint-plugin-jsx-a11y>eslint": "10"
