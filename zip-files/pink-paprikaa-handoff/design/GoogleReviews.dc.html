<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div style="display:flex;flex-direction:column;gap:32px;font-family:var(--font-body);color:var(--text-body)">
  <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px">
    <div style="display:flex;flex-direction:column;gap:12px;max-width:640px;min-width:0">
      <span style="display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink-500)"><x-import component-from-global-scope="PinkPaprikaaDesignSystem_23ef63.Icon" name="badge-check" size="{{ 16 }}" hint-size="16px,16px"></x-import>{{ eyebrow }}</span>
      <h2 style="margin:0;font-family:var(--font-display);font-weight:800;font-size:var(--fs-display-2-fluid);line-height:1.05;letter-spacing:-.03em;color:var(--ink-900);text-wrap:balance">{{ heading }}</h2>
    </div>
    <sc-if value="{{ hasReviews }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:8px">
      <button onClick="{{ prev }}" aria-label="Previous reviews" style="width:48px;height:48px;border-radius:50%;border:1px solid var(--border-default);background:#fff;color:var(--ink-900);display:grid;place-items:center;cursor:pointer"><x-import component-from-global-scope="PinkPaprikaaDesignSystem_23ef63.Icon" name="arrow-left" size="{{ 20 }}" hint-size="20px,20px"></x-import></button>
      <button onClick="{{ next }}" aria-label="Next reviews" style="width:48px;height:48px;border-radius:50%;border:0;background:var(--pink-500);color:#fff;display:grid;place-items:center;cursor:pointer"><x-import component-from-global-scope="PinkPaprikaaDesignSystem_23ef63.Icon" name="arrow-right" size="{{ 20 }}" hint-size="20px,20px"></x-import></button>
    </div></sc-if>
  </div>
  <sc-if value="{{ hasReviews }}" hint-placeholder-val="{{ false }}">
  <div ref="{{ track }}" style="display:grid;grid-auto-flow:column;grid-auto-columns:minmax(min(320px,85%),1fr);gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 16px;scrollbar-width:thin">
    <sc-for list="{{ reviews }}" as="r" hint-placeholder-count="3">
      <article style="scroll-snap-align:start;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
          <x-import component-from-global-scope="PinkPaprikaaDesignSystem_23ef63.Rating" value="{{ r.rating }}" size="{{ 16 }}" show-value="{{ false }}" symbol="{{ true }}" base="assets" hint-size="100px,16px"></x-import>
          <span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#1d6e52;background:var(--mint-soft);padding:4px 10px;border-radius:var(--radius-pill);white-space:nowrap"><x-import component-from-global-scope="PinkPaprikaaDesignSystem_23ef63.Icon" name="badge-check" size="{{ 14 }}" hint-size="14px,14px"></x-import>Verified on Google</span>
        </div>
        <p style="margin:0;font-size:16px;line-height:1.6;color:var(--ink-900);flex:1;text-wrap:pretty">&ldquo;{{ r.quote }}&rdquo;</p>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--border-subtle);padding-top:14px;flex-wrap:wrap">
          <div style="display:flex;flex-direction:column;min-width:0">
            <span style="font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--ink-900)">{{ r.name }}</span>
            <span style="font-size:13px;color:var(--text-muted)">{{ r.meta }}</span>
          </div>
          <a href="{{ r.url }}" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--text-link);white-space:nowrap">View on Google <x-import component-from-global-scope="PinkPaprikaaDesignSystem_23ef63.Icon" name="external-link" size="{{ 14 }}" hint-size="14px,14px"></x-import></a>
        </div>
      </article>
    </sc-for>
  </div>
  </sc-if>
  <sc-if value="{{ noReviews }}" hint-placeholder-val="{{ true }}">
    <div style="background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);padding:clamp(20px,3vw,28px);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between">
      <div style="display:flex;gap:14px;align-items:center;min-width:0;flex:1 1 280px">
        <x-import component-from-global-scope="PinkPaprikaaDesignSystem_23ef63.Logo" variant="symbol" tone="badge" width="{{ 48 }}" base="assets" hint-size="48px,48px"></x-import>
        <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
          <span style="font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--ink-900)">Read what our guests say on Google</span>
          <span style="font-size:14px;color:var(--text-muted)">Every review there is from a real Pink Paprikaa guest.</span>
        </div>
      </div>
      <x-import component-from-global-scope="PinkPaprikaaDesignSystem_23ef63.Button" variant="primary" size="md" icon-after="arrow-up-right" on-click="{{ openGoogle }}" hint-size="200px,44px">Open Google reviews</x-import>
    </div>
  </sc-if>
  <a href="{{ allUrl }}" target="_blank" rel="noopener" style="align-self:flex-start;display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:700;color:var(--text-link)">Read all our reviews on Google <x-import component-from-global-scope="PinkPaprikaaDesignSystem_23ef63.Icon" name="arrow-up-right" size="{{ 16 }}" hint-size="16px,16px"></x-import></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:460},&quot;heading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Gurgaon eats with us every day.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;filter&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;daily&quot;,&quot;catering&quot;,&quot;office&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  track = React.createRef();
  renderVals() {
    const by = (dx) => { const el = this.track.current; if (el) el.scrollBy({ left: dx * el.clientWidth * 0.9, behavior: 'smooth' }); };
    const U = 'https://g.page/r/REPLACE_WITH_REVIEW_LINK';
    const all = {
      mixed: [
        { name: 'Customer name', meta: 'Homely Meals · Sep 2026', rating: 5, quote: 'Sample review — paste the real Google review text here. Dal tastes like home and the box always comes on time.', url: U },
        { name: 'Customer name', meta: 'Catering · Aug 2026', rating: 5, quote: 'Sample review — ordered for 60 guests at a pooja. Food was hot, everyone asked who the caterer was.', url: U },
        { name: 'Customer name', meta: 'Office lunch · Aug 2026', rating: 5, quote: 'Sample review — our team has been on the office plan for months. Fresh every day, never oily.', url: U },
        { name: 'Customer name', meta: 'Homely Meals · Jul 2026', rating: 4.5, quote: 'Sample review — as a PG resident this saved me. Good portions, different sabzi every day.', url: U },
        { name: 'Customer name', meta: 'Catering · Jul 2026', rating: 5, quote: 'Sample review — birthday party for 35. Paneer and gulab jamun were gone in minutes.', url: U }
      ]
    };
    const f = this.props.filter;
    const real = ((window.PP_RATES && window.PP_RATES.google.reviews) || []);
    const list = real.filter(r => !f || (r.meta || '').toLowerCase().startsWith(f));
    const G = (window.PP_RATES && window.PP_RATES.google) || {};
    if (!window.PP_RATES && !this._t) this._t = setInterval(() => { if (window.PP_RATES) { clearInterval(this._t); this.forceUpdate(); } }, 60);
    return {
      eyebrow: G.rating ? `${G.rating} on Google · ${G.count} verified reviews` : 'Verified Google reviews',
      track: this.track,
      heading: this.props.heading || 'Gurgaon eats with us every day.',
      reviews: list.length ? list : real, hasReviews: real.length > 0, noReviews: real.length === 0,
      openGoogle: () => window.open(G.url || '#', '_blank'),
      allUrl: G.url || '#',
      prev: () => by(-1), next: () => by(1)
    };
  }
}
</script>
</body>
</html>
