<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script><style>body{margin:0}a{color:var(--text-link);text-decoration:none}a:hover{color:var(--text-link-hover)}</style></helmet>
<header style="position:sticky;top:0;z-index:50;width:100%">
  <a href="HomelyMeals.dc.html" data-surface="brand" style="background:var(--pink-500);color:#fff;font-family:var(--font-body);font-size:13px;padding:7px 16px;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;text-align:center">
    <span>Launch price: <strong>Classic at ₹130 a meal</strong> for the first 50 subscribers · closes in</span>
    <span style="font-family:var(--font-mono);font-weight:700;background:var(--ink-900);color:#fff;padding:1px 8px;border-radius:var(--radius-pill);white-space:nowrap">{{ countdown }}</span>
  </a>
  <div style="background:var(--surface-glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border-subtle)">
    <div style="max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,40px);height:64px;display:flex;align-items:center;gap:20px">
      <a href="Home.dc.html" aria-label="Pink Paprikaa home" style="display:flex;align-items:center;flex:0 0 auto">
        <x-import component-from-global-scope="PinkPaprikaaDesignSystem_23ef63.Logo" variant="lockup" tone="pink" height="{{ 40 }}" base="assets" hint-size="76px,40px"></x-import>
      </a>
      <span style="display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;background:var(--mint-soft);color:#1d6e52;font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:var(--radius-pill);white-space:nowrap">
        <x-import component-from-global-scope="PinkPaprikaaDesignSystem_23ef63.DietMark" type="veg" size="{{ 12 }}" hint-size="12px,12px"></x-import>Pure Veg
      </span>
      <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
        <nav style="display:flex;align-items:center;gap:24px;font-family:var(--font-display);font-weight:600;font-size:15px;margin-left:12px">
          <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
            <a href="{{ l.href }}" style="{{ l.style }}">{{ l.label }}</a>
          </sc-for>
        </nav>
      </sc-if>
      <div style="flex:1"></div>
      <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;gap:8px;align-items:center">
          <x-import component-from-global-scope="PinkPaprikaaDesignSystem_23ef63.Button" variant="secondary" size="sm" icon="shopping-bag" on-click="{{ orderOnline }}" hint-size="130px,36px">Order online</x-import>
          <x-import component-from-global-scope="PinkPaprikaaDesignSystem_23ef63.Button" variant="primary" size="sm" icon="message-circle" on-click="{{ openWa }}" hint-size="140px,36px">WhatsApp us</x-import>
        </div>
      </sc-if>
      <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;gap:8px;align-items:center">
          <button onClick="{{ openWa }}" aria-label="WhatsApp us" style="width:44px;height:44px;border:0;border-radius:var(--radius-pill);background:var(--pink-500);color:#fff;display:grid;place-items:center;cursor:pointer">
            <x-import component-from-global-scope="PinkPaprikaaDesignSystem_23ef63.Icon" name="message-circle" size="{{ 20 }}" hint-size="20px,20px"></x-import>
          </button>
          <button onClick="{{ toggle }}" aria-label="Menu" style="width:44px;height:44px;border:1px solid var(--border-default);border-radius:var(--radius-md);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink-900)">
            <x-import component-from-global-scope="PinkPaprikaaDesignSystem_23ef63.Icon" name="{{ menuIcon }}" size="{{ 20 }}" hint-size="20px,20px"></x-import>
          </button>
        </div>
      </sc-if>
    </div>
    <sc-if value="{{ drawer }}" hint-placeholder-val="{{ false }}">
      <nav style="display:flex;flex-direction:column;padding:4px 16px 20px;font-family:var(--font-display);font-weight:600;font-size:18px;border-top:1px solid var(--border-subtle);max-height:calc(100vh - 110px);overflow-y:auto">
        <sc-for list="{{ allLinks }}" as="l" hint-placeholder-count="7">
          <a href="{{ l.href }}" style="padding:14px 0;border-bottom:1px solid var(--border-subtle);color:var(--ink-900);display:flex;justify-content:space-between;align-items:center">{{ l.label }}<x-import component-from-global-scope="PinkPaprikaaDesignSystem_23ef63.Icon" name="chevron-right" size="{{ 18 }}" style="color:var(--text-muted)" hint-size="18px,18px"></x-import></a>
        </sc-for>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px">
          <x-import component-from-global-scope="PinkPaprikaaDesignSystem_23ef63.Button" variant="secondary" size="md" full-width="{{ true }}" on-click="{{ orderOnline }}" hint-size="100%,44px">Order online</x-import>
          <x-import component-from-global-scope="PinkPaprikaaDesignSystem_23ef63.Button" variant="primary" size="md" full-width="{{ true }}" on-click="{{ openWa }}" hint-size="100%,44px">WhatsApp us</x-import>
        </div>
      </nav>
    </sc-if>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:110},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;homely&quot;,&quot;catering&quot;,&quot;menu&quot;,&quot;about&quot;,&quot;office&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;page&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { now: Date.now(), w: typeof window !== 'undefined' ? window.innerWidth : 1280, open: false };
  componentDidMount() {
    this.t = setInterval(() => this.setState({ now: Date.now() }), 1000);
    this.onR = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onR);
  }
  componentWillUnmount() { clearInterval(this.t); window.removeEventListener('resize', this.onR); }
  renderVals() {
    const ends = new Date((window.PP_RATES && window.PP_RATES.homely.launch.ends) || '2026-10-31T23:59:59+05:30');
    const s = Math.max(0, Math.floor((ends - this.state.now) / 1000));
    const day = '';
    const p = n => String(n).padStart(2, '0');
    const active = this.props.active || '';
    const page = this.props.page || 'Home';
    const main = [
      { k: 'homely', label: 'Homely Meals', href: 'HomelyMeals.dc.html' },
      { k: 'catering', label: 'Catering', href: 'Catering.dc.html' },
      { k: 'menu', label: 'Menu', href: 'Menu.dc.html' },
      { k: 'about', label: 'About', href: 'About.dc.html' }
    ];
    const links = main.map(l => ({ ...l, style: { color: l.k === active ? 'var(--pink-500)' : 'var(--ink-900)', whiteSpace: 'nowrap', borderBottom: '2px solid ' + (l.k === active ? 'var(--pink-500)' : 'transparent'), padding: '6px 0' } }));
    const allLinks = [{ label: 'Home', href: 'Home.dc.html' }, main[0], { label: 'This week’s menu', href: 'ThisWeek.dc.html' }, main[1], { label: 'Office & PG Lunch', href: 'OfficeLunch.dc.html' }, main[2], main[3], { label: 'Contact', href: 'Contact.dc.html' }];
    const wide = this.state.w >= 1024;
    return {
      countdown: `${Math.floor(s / 86400)}d ${p(Math.floor(s % 86400 / 3600))}h ${p(Math.floor(s % 3600 / 60))}m ${p(s % 60)}s`,
      cutoffDay: day, links, allLinks, wide, narrow: !wide, drawer: !wide && this.state.open,
      menuIcon: this.state.open ? 'x' : 'menu',
      toggle: () => this.setState(x => ({ open: !x.open })),
      orderOnline: () => window.open((window.PP_RATES && window.PP_RATES.links.orderOnline) || '#', '_blank'),
      openWa: () => window.ppWa && window.ppWa(page, 'Hi Pink Paprikaa, I have a question.')
    };
  }
}
</script>
</body>
</html>
