<!-- @dsCard group="Marketing" viewport="1200x900" name="Social & ads" subtitle="Instagram posts, carousel, stories, link banner, leaderboard, MPU — real pixel canvases" -->
<!doctype html><html><head><meta charset="utf-8"><title>Pink Paprikaa — Marketing artboards</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../brand.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0}body{background:var(--ink-100)}.wrap{max-width:1200px;margin:0 auto;padding:28px var(--gutter-fluid) 56px}.boards{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}.cap{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-subtle);margin-top:10px}.board{background:var(--ink-000);padding:12px;border-radius:var(--radius-lg);box-shadow:var(--shadow-1)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="FeedArtboards.jsx"></script>
<script type="text/babel" src="AdArtboards.jsx"></script>
<script type="text/babel">
const { Tabs, Switch, SectionHeader } = window.PinkPaprikaaDesignSystem_23ef63;

function Board({ label, size, children }) {
  return (<div className="board"><div>{children}</div><div className="cap">{label} · {size}</div></div>);
}

function Marketing(){
  const [tab,setTab]=React.useState('Feed');
  const [safe,setSafe]=React.useState(true);
  return (<div className="wrap">
    <SectionHeader overline="Marketing" title="Social & ad artboards" lede="Every asset is authored at its true pixel canvas and scaled for preview. Sizes come from the --canvas-* tokens." />
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:24,flexWrap:'wrap',marginTop:26}}>
      <Tabs items={['Feed','Stories','Ads']} value={tab} onChange={setTab}/>
      {tab==='Stories'?<Switch label="Show safe-area guides" checked={safe} onChange={()=>setSafe(!safe)}/>:null}
    </div>
    <div className="boards" style={{marginTop:26}}>
      {tab==='Feed'?(<React.Fragment>
        <Board label="Offer post" size="1080×1080"><OfferPost scale={0.34}/></Board>
        <Board label="Dish launch" size="1080×1080"><DishLaunchPost scale={0.34}/></Board>
        <Board label="Statement" size="1080×1350"><StatementPost scale={0.28}/></Board>
        <Board label="Carousel slide" size="1080×1080"><CarouselSlide scale={0.34}/></Board>
      </React.Fragment>):null}
      {tab==='Stories'?(<React.Fragment>
        <Board label="Offer story" size="1080×1920"><OfferStory scale={0.2} safeArea={safe}/></Board>
        <Board label="Dish story" size="1080×1920"><DishStory scale={0.2} safeArea={safe}/></Board>
      </React.Fragment>):null}
      {tab==='Ads'?(<React.Fragment>
        <Board label="Link / OG" size="1200×628"><LinkBanner scale={0.5}/></Board>
        <Board label="Leaderboard" size="728×90"><Leaderboard scale={1}/></Board>
        <Board label="MPU" size="300×250"><Mpu scale={1}/></Board>
      </React.Fragment>):null}
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Marketing/>);
</script></body></html>
