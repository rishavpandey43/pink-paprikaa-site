<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:20px 24px;font-family:var(--font-body);background:var(--surface-page)}

.t{border-radius:var(--radius-lg);display:grid;place-items:center;padding:24px;height:120px;box-sizing:border-box}

<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px">

<div><div class="t" style="background:var(--ink-900)"><img src="../assets/logo-wordmark-white.svg" alt="Pink Paprikaa"></div><div class="k">logo-wordmark-white</div></div>
<div><div class="t" style="padding:12px;background:var(--surface-sunken)"><img src="../assets/logo-wordmark-badge.svg" alt="Pink Paprikaa"></div><div class="k">logo-wordmark-badge</div></div>
</div>
<div class="k" style="margin-top:14px">Clear space = the height of the &ldquo;P&rdquo;. Minimum wordmark width 140px. Never recolour, rotate, outline or add effects.</div>
