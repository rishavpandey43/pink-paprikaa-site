<!-- @dsCard group="Colors" viewport="700x170" name="Semantic surfaces & text" subtitle="Aliases to reach for in components." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:20px 24px;font-family:var(--font-body);background:var(--surface-page)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
<div style="background:var(--surface-page);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:12px"><div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)">--surface-page</div><div style="font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--text-heading);margin-top:8px">Heading</div><div style="font-size:12.5px;color:var(--text-body)">--text-body</div><div style="font-size:12.5px;color:var(--text-muted)">--text-muted</div></div>
<div style="background:var(--surface-page-alt);border-radius:var(--radius-md);padding:12px"><div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)">--surface-page-alt</div><div style="font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--text-brand);margin-top:8px">--text-brand</div><div style="font-size:12.5px;color:var(--text-body)">Tinted section</div></div>
<div style="background:var(--surface-brand);border-radius:var(--radius-md);padding:12px"><div style="font-family:var(--font-mono);font-size:10.5px;color:rgba(255,255,255,.72)">--surface-brand</div><div style="font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--text-on-brand);margin-top:8px">--text-on-brand</div><div style="font-size:12.5px;color:rgba(255,255,255,.8)">Flooded pink panel</div></div>
<div style="background:var(--surface-inverse);border-radius:var(--radius-md);padding:12px"><div style="font-family:var(--font-mono);font-size:10.5px;color:rgba(255,255,255,.6)">--surface-inverse</div><div style="font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--text-on-inverse);margin-top:8px">--text-on-inverse</div><div style="font-size:12.5px;color:rgba(255,255,255,.7)">Footer / ink panel</div></div></div></body></html>
