<!-- @dsCard group="Motion" viewport="700x180" name="Duration & easing" subtitle="Hover 140ms, state 220ms, sheets 340ms. --ease-pop only for add-to-cart." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:20px 24px;font-family:var(--font-body);background:var(--surface-page)}</style></head><body><style>.tr{height:10px;background:var(--ink-200);border-radius:99px;position:relative;overflow:hidden}.tr i{position:absolute;inset:0;width:34px;background:var(--pink-500);border-radius:99px;animation:sl 2.4s infinite}@keyframes sl{0%,8%{transform:translateX(0)}50%,58%{transform:translateX(calc(300px - 34px))}100%{transform:translateX(0)}}.e2 i{animation-timing-function:var(--ease-in-out)}.e1 i{animation-timing-function:var(--ease-out)}.e3 i{animation-timing-function:var(--ease-entrance)}.e4 i{animation-timing-function:var(--ease-pop)}</style>
<div style="display:grid;gap:12px;max-width:300px"><div style="display:flex;align-items:center;gap:14px"><div class="tr e1" style="width:300px"><i></i></div><div style="white-space:nowrap"><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-heading)">--ease-out</span> <span style="font-size:11px;color:var(--text-subtle)">140–220ms</span></div></div><div style="display:flex;align-items:center;gap:14px"><div class="tr e2" style="width:300px"><i></i></div><div style="white-space:nowrap"><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-heading)">--ease-in-out</span> <span style="font-size:11px;color:var(--text-subtle)">220ms</span></div></div><div style="display:flex;align-items:center;gap:14px"><div class="tr e3" style="width:300px"><i></i></div><div style="white-space:nowrap"><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-heading)">--ease-entrance</span> <span style="font-size:11px;color:var(--text-subtle)">340ms</span></div></div><div style="display:flex;align-items:center;gap:14px"><div class="tr e4" style="width:300px"><i></i></div><div style="white-space:nowrap"><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-heading)">--ease-pop</span> <span style="font-size:11px;color:var(--text-subtle)">220ms · add-to-cart only</span></div></div></div></body></html>
