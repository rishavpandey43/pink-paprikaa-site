<!-- @dsCard group="Colors" viewport="700x140" name="Status colors" subtitle="Success, warning, danger, info — each with a soft fill." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:20px 24px;font-family:var(--font-body);background:var(--surface-page)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div style="background:var(--status-success-soft);border-radius:var(--radius-md);padding:12px 14px"><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;background:var(--status-success);border-radius:2px;transform:rotate(45deg)"></span><span style="font-family:var(--font-display);font-weight:700;font-size:12px;color:var(--ink-900)">Order confirmed</span></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:8px">--status-success</div></div><div style="background:var(--status-warning-soft);border-radius:var(--radius-md);padding:12px 14px"><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;background:var(--status-warning);border-radius:2px;transform:rotate(45deg)"></span><span style="font-family:var(--font-display);font-weight:700;font-size:12px;color:var(--ink-900)">Kitchen is busy</span></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:8px">--status-warning</div></div><div style="background:var(--status-danger-soft);border-radius:var(--radius-md);padding:12px 14px"><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;background:var(--status-danger);border-radius:2px;transform:rotate(45deg)"></span><span style="font-family:var(--font-display);font-weight:700;font-size:12px;color:var(--ink-900)">Payment failed</span></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:8px">--status-danger</div></div><div style="background:var(--status-info-soft);border-radius:var(--radius-md);padding:12px 14px"><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;background:var(--status-info);border-radius:2px;transform:rotate(45deg)"></span><span style="font-family:var(--font-display);font-weight:700;font-size:12px;color:var(--ink-900)">Table held 10 min</span></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:8px">--status-info</div></div></div></body></html>
