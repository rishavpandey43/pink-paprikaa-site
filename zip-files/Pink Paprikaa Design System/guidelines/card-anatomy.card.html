<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:20px 24px;font-family:var(--font-body);background:var(--surface-page)}.k{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16">

</div><div class="k" style="margin-top:14px">No card ever gets a coloured left border. Media cards use padding 0 and radius on the image corners only.</div></body></html>
