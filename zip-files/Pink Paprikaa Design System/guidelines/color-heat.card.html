<!-- @dsCard group="Colors" viewport="700x140" name="Spice heat scale" subtitle="Heat is shown with diamonds on the --heat-* ramp, never with emoji." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:20px 24px;font-family:var(--font-body);background:var(--surface-page)}</style></head><body><div style="display:flex;gap:24px;align-items:flex-end"><div><div style="display:flex;gap:5px"><span style="width:12px;height:12px;transform:rotate(45deg);border-radius:2px;background:var(--heat-1)"></span><span style="width:12px;height:12px;transform:rotate(45deg);border-radius:2px;background:var(--ink-200)"></span><span style="width:12px;height:12px;transform:rotate(45deg);border-radius:2px;background:var(--ink-200)"></span><span style="width:12px;height:12px;transform:rotate(45deg);border-radius:2px;background:var(--ink-200)"></span></div><div class="pp-overline" style="color:var(--text-heading);margin-top:10px">Mild</div><div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)">--heat-1</div></div><div><div style="display:flex;gap:5px"><span style="width:12px;height:12px;transform:rotate(45deg);border-radius:2px;background:var(--heat-2)"></span><span style="width:12px;height:12px;transform:rotate(45deg);border-radius:2px;background:var(--heat-2)"></span><span style="width:12px;height:12px;transform:rotate(45deg);border-radius:2px;background:var(--ink-200)"></span><span style="width:12px;height:12px;transform:rotate(45deg);border-radius:2px;background:var(--ink-200)"></span></div><div class="pp-overline" style="color:var(--text-heading);margin-top:10px">Medium</div><div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)">--heat-2</div></div><div><div style="display:flex;gap:5px"><span style="width:12px;height:12px;transform:rotate(45deg);border-radius:2px;background:var(--heat-3)"></span><span style="width:12px;height:12px;transform:rotate(45deg);border-radius:2px;background:var(--heat-3)"></span><span style="width:12px;height:12px;transform:rotate(45deg);border-radius:2px;background:var(--heat-3)"></span><span style="width:12px;height:12px;transform:rotate(45deg);border-radius:2px;background:var(--ink-200)"></span></div><div class="pp-overline" style="color:var(--text-heading);margin-top:10px">Hot</div><div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)">--heat-3</div></div><div><div style="display:flex;gap:5px"><span style="width:12px;height:12px;transform:rotate(45deg);border-radius:2px;background:var(--heat-4)"></span><span style="width:12px;height:12px;transform:rotate(45deg);border-radius:2px;background:var(--heat-4)"></span><span style="width:12px;height:12px;transform:rotate(45deg);border-radius:2px;background:var(--heat-4)"></span><span style="width:12px;height:12px;transform:rotate(45deg);border-radius:2px;background:var(--heat-4)"></span></div><div class="pp-overline" style="color:var(--text-heading);margin-top:10px">Extra Hot</div><div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)">--heat-4</div></div></div></body></html>
