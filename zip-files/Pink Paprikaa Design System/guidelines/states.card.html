</head><body><div id="root"></div><script type="text/babel">
const { Button, IconButton, TextButton, Link, Tag, PageButton } = window.PinkPaprikaaDesignSystem_23ef63;
const ST = ["rest","hover","press","focus","disabled"];

const T = [["--state-hover","pink-50 · hover on light"],["--state-press","pink-100 · press on light"],["--state-hover-neutral","ink-100 · neutral hover"],["--state-press-neutral","ink-200 · neutral press"],["--state-hover-on-color","white 16% · on pink/ink/status"],["--state-press-on-color","white 28% · on pink/ink/status"],["--state-hover-tint","ink 6% · inherits parent colour"],["--state-press-tint","ink 12% · inherits parent colour"],["--state-press-danger","danger press"],["--state-disabled-fill","ink-100 · disabled fill"],["--brand-hover","pink-600 · filled pink hover"],["--brand-active","pink-700 · filled pink press"]];
function Demo(){return(<Rows>
<Row label="the rule" note="no exceptions"><div style={{fontSize:14,lineHeight:1.55,color:'var(--text-body)',maxWidth:'58ch'}}>Anything a guest can press has <b>five states</b>. Hover darkens one step (pointer only, never on touch). Press darkens a second step and scales to 0.97 in 80ms; Space/Enter show it too. Focus is keyboard-only: a 2px ring, white on coloured surfaces. Disabled is a real grey, never just opacity. All components read one hook, <code>usePress</code>, and the tokens below.</div></Row>
<Row label="Button" note="primary">{map((s,d)=><Button size="sm" state={s} disabled={d}>Order Now</Button>)}</Row>
<Row label="Button" note="secondary">{map((s,d)=><Button size="sm" variant="secondary" state={s} disabled={d}>See Menu</Button>)}</Row>
<Row label="Button" note="ghost">{map((s,d)=><Button size="sm" variant="ghost" state={s} disabled={d}>Find Us</Button>)}</Row>
<Row label="TextButton" note="toast / inline actions">{map((s,d)=><TextButton state={s} disabled={d}>Edit</TextButton>)}</Row>
<Row label="TextButton" note='on="brand" caps' className="pad on-brand">{map((s,d)=><TextButton on="brand" caps size="sm" state={s} disabled={d}>View Cart</TextButton>)}</Row>
<Row label="IconButton">{map((s,d)=><IconButton icon="heart" label="Save" variant="secondary" state={s} disabled={d}/>)}</Row>
<Row label="Link">{map((s,d)=><Link state={s} disabled={d}>Outlets</Link>)}</Row>
<Row label="Tag">{map((s,d)=><Tag onClick={()=>{}} state={s} disabled={d}>Sweets</Tag>)}</Row>
{PageButton ? <Row label="Pagination">{map((s,d)=><PageButton state={s} disabled={d}>3</PageButton>)}</Row> : null}
<Row label="tokens" note="tokens/colors.css"><div className="grid">{T.map(([k,n])=><div key={k} className="tk"><div className="sw" style={{background:'var('+k+')'}}></div><div style={{display:'grid',minWidth:0}}><code>{k}</code><span>{n}</span></div></div>)}</div></Row>
<Row label="timing"><div style={{fontSize:13.5,color:'var(--text-muted)'}}>hover/colour <code>--dur-fast</code> 140ms · press <code>--dur-instant</code> 80ms · <code>--ease-out</code> · never fade a control on hover.</div></Row>
</Rows>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
