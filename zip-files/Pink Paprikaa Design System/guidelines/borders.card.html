<!-- @dsCard group="Spacing" viewport="700x170" name="Borders & focus" subtitle="1px default, 2px on focus/selected, plus the pink focus ring." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:20px 24px;font-family:var(--font-body);background:var(--surface-page)}.k{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}</style></head><body><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
<div style="width:150px;height:48px;border:1px solid var(--border-subtle);border-radius:var(--radius-md);display:grid;place-items:center" class="k">border-subtle</div>
<div style="width:150px;height:48px;border:1px solid var(--border-default);border-radius:var(--radius-md);display:grid;place-items:center" class="k">border-default</div>
<div style="width:150px;height:48px;border:2px solid var(--border-brand);border-radius:var(--radius-md);box-shadow:var(--focus-ring);display:grid;place-items:center" class="k">focus · 2px + ring</div>
<div style="width:150px;height:48px;border:2px solid var(--ink-900);border-radius:var(--radius-md);display:grid;place-items:center" class="k">border-strong</div></div></body></html>
