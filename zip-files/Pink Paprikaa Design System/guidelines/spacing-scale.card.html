<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{padding:20px 24px;font-family:var(--font-body);background:var(--surface-page)}.k{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}</style></head><body>
<div style="display:flex;align-items:flex-end;gap:12px"><div><div style="width:var(--space-1);height:60px;background:var(--pink-500);border-radius:2px"></div><div class="k" style="margin-top:8px;color:var(--text-heading)">1</div><div class="k">4</div></div><div><div style="width:var(--space-2);height:60px;background:var(--pink-500);border-radius:2px"></div><div class="k" style="margin-top:8px;color:var(--text-heading)">2</div><div class="k">8</div></div><div><div style="width:var(--space-3);height:60px;background:var(--pink-500);border-radius:2px"></div><div class="k" style="margin-top:8px;color:var(--text-heading)">3</div><div class="k">12</div></div><div><div style="width:var(--space-4);height:60px;background:var(--pink-500);border-radius:2px"></div><div class="k" style="margin-top:8px;color:var(--text-heading)">4</div><div class="k">16</div></div><div><div style="width:var(--space-5);height:60px;background:var(--pink-500);border-radius:2px"></div><div class="k" style="margin-top:8px;color:var(--text-heading)">5</div><div class="k">20</div></div><div><div style="width:var(--space-6);height:60px;background:var(--pink-500);border-radius:2px"></div><div class="k" style="margin-top:8px;color:var(--text-heading)">6</div><div class="k">24</div></div><div><div style="width:var(--space-8);height:60px;background:var(--pink-500);border-radius:2px"></div><div class="k" style="margin-top:8px;color:var(--text-heading)">8</div><div class="k">32</div></div><div><div style="width:var(--space-10);height:60px;background:var(--pink-500);border-radius:2px"></div><div class="k" style="margin-top:8px;color:var(--text-heading)">10</div><div class="k">40</div></div><div><div style="width:var(--space-12);height:60px;background:var(--pink-500);border-radius:2px"></div><div class="k" style="margin-top:8px;color:var(--text-heading)">12</div><div class="k">48</div></div><div><div style="width:var(--space-16);height:60px;background:var(--pink-500);border-radius:2px"></div><div class="k" style="margin-top:8px;color:var(--text-heading)">16</div><div class="k">64</div></div><div><div style="width:var(--space-24);height:60px;background:var(--pink-500);border-radius:2px"></div><div class="k" style="margin-top:8px;color:var(--text-heading)">24</div><div class="k">96</div></div></div>
<div class="k" style="margin-top:14px">--space-0 &middot; half steps --space-0-5 (2px) and --space-1-5 (6px) &middot; then 1&ndash;12, 14, 16, 18, 20, 24, 32. 4 / 6 / 10 do most of the work.</div>
</body></html>
