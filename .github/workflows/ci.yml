name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # Must run before setup-node so that `cache: pnpm` can find pnpm.
      # Reads the version from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Derives NX_BASE / NX_HEAD so `nx affected` compares against the
      # last successful commit rather than rebuilding the whole workspace.
      - uses: nrwl/nx-set-shas@v4

      - name: Formatting
        run: pnpm nx format:check

      - name: TypeScript project references in sync
        run: pnpm nx sync:check

      - name: Typecheck, lint, test, build
        run: pnpm nx affected -t typecheck lint test build

  # The e2e and lighthouse jobs described in the architecture spec (§12, §14)
  # are added alongside the apps they test — they have no targets to run until
  # apps/web exists.
