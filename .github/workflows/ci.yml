name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # Must run before setup-node so that `cache: pnpm` can find pnpm.
      # Reads the version from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Derives NX_BASE / NX_HEAD so `nx affected` compares against the
      # last successful commit rather than rebuilding the whole workspace.
      - uses: nrwl/nx-set-shas@v4

      - name: Formatting
        run: pnpm nx format:check

      - name: TypeScript project references in sync
        run: pnpm nx sync:check

      - name: Typecheck, lint, test, build
        run: pnpm nx affected -t typecheck lint test build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm nx affected -t e2e

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx build web
      - run: pnpm exec lhci autorun

  guards:
    name: Content guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t build
      - run: pnpm guard:founder

  deploy:
    # Phase 6 cutover — becomes real when Netlify access exists (spec §16).
    # Gated off until the repository variable NETLIFY_DEPLOY_ENABLED is set to "true".
    name: Deploy
    if: github.ref == 'refs/heads/main' && vars.NETLIFY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: [verify, e2e, lighthouse, guards]
    steps:
      - run: echo "Netlify deploy lands at Phase 6 cutover (arch spec §14, §16)."
